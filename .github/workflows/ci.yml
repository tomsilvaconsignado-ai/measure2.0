# CI (typecheck + testes + build) em todo push e pull request.
# Publicação no GitHub Pages só em push na main, depois do CI passar.
# Pré-requisito (uma vez): Settings > Pages > Source = "GitHub Actions".

name: CI / Publicação

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run lint
      - name: Testes unitários
        run: npm test
      - name: Testes do banco (migrações + RLS no PGlite)
        run: npm run test:db
      - name: Auditoria de dependências
        run: npm audit --omit=dev --audit-level=high
      - name: Build
        run: npm run build

  build-pages:
    needs: ci
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: npm
      - run: npm ci
      - name: Build
        env:
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
        run: |
          grep -q '^VITE_SUPABASE_URL=https' .env.production || { echo "::error::.env.production sem VITE_SUPABASE_URL"; exit 1; }
          npm run build
          # Rotas da SPA ao recarregar: o Pages serve o 404.html, que é o próprio app
          cp dist/index.html dist/404.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy-pages:
    needs: build-pages
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
